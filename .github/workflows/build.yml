name: Build and Release Windows App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Electron App
        run: npx electron-builder --win

      # Этот шаг выкладывает файлы прямо на экран Actions:
      - name: Save Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bento-KP-Windows-App
          path: |
            dist/*.exe
            dist/latest.yml
